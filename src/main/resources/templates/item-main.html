<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Management</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --danger: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            color: var(--primary);
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #d1145a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .alert-error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        .actions button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Items Management</h1>
        <button id="addItemBtn" class="btn">Add New Item</button>
    </header>

    <div id="alertContainer"></div>

    <table id="itemsTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Cost</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="itemsTableBody">
        <!-- Items will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Add/Edit Item Modal -->
<div id="itemModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Item</h2>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <div class="form-group">
                <label for="itemName">Name</label>
                <input type="text" id="itemName" required>
            </div>
            <div class="form-group">
                <label for="itemCost">Cost</label>
                <input type="number" id="itemCost" step="0.01" required>
            </div>
            <div class="actions">
                <button type="button" class="btn" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn" id="saveBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete this item?</p>
        <div class="actions">
            <button type="button" class="btn" id="cancelDeleteBtn">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>
</div>

<script>
    // DOM Elements
    const addItemBtn = document.getElementById('addItemBtn');
    const itemsTableBody = document.getElementById('itemsTableBody');
    const itemModal = document.getElementById('itemModal');
    const deleteModal = document.getElementById('deleteModal');
    const modalTitle = document.getElementById('modalTitle');
    const itemForm = document.getElementById('itemForm');
    const itemIdInput = document.getElementById('itemId');
    const itemNameInput = document.getElementById('itemName');
    const itemCostInput = document.getElementById('itemCost');
    const closeButtons = document.querySelectorAll('.close');
    const cancelBtn = document.getElementById('cancelBtn');
    const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
    const alertContainer = document.getElementById('alertContainer');

    // State
    let items = [];
    let currentItemId = null;

    // Event Listeners
    addItemBtn.addEventListener('click', () => {
        currentItemId = null;
        modalTitle.textContent = 'Add New Item';
        itemIdInput.value = '';
        itemNameInput.value = '';
        itemCostInput.value = '';
        itemModal.style.display = 'block';
    });

    itemForm.addEventListener('submit', handleSaveItem);
    confirmDeleteBtn.addEventListener('click', handleDeleteItem);

    closeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            itemModal.style.display = 'none';
            deleteModal.style.display = 'none';
        });
    });

    cancelBtn.addEventListener('click', () => {
        itemModal.style.display = 'none';
    });

    cancelDeleteBtn.addEventListener('click', () => {
        deleteModal.style.display = 'none';
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', fetchItems);

    // Functions
    async function fetchItems() {
        try {
            const response = await fetch('/api/items');
            if (!response.ok) throw new Error('Failed to fetch items');

            items = await response.json();
            renderItems();
        } catch (error) {
            showAlert('Error loading items: ' + error.message, 'error');
        }
    }

    function renderItems() {
        itemsTableBody.innerHTML = '';

        items.forEach(item => {
            const row = document.createElement('tr');

            row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>$${item.cost.toFixed(2)}</td>
                    <td>
                        <button class="btn" onclick="editItem(${item.id})">Edit</button>
                        <button class="btn btn-danger" onclick="confirmDelete(${item.id})">Delete</button>
                    </td>
                `;

            itemsTableBody.appendChild(row);
        });
    }

    window.editItem = function(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;

        currentItemId = id;
        modalTitle.textContent = 'Edit Item';
        itemIdInput.value = item.id;
        itemNameInput.value = item.name;
        itemCostInput.value = item.cost;
        itemModal.style.display = 'block';
    };

    window.confirmDelete = function(id) {
        currentItemId = id;
        deleteModal.style.display = 'block';
    };

    async function handleSaveItem(e) {
        e.preventDefault();

        const item = {
            name: itemNameInput.value,
            cost: parseFloat(itemCostInput.value)
        };

        if (currentItemId) {
            item.id = currentItemId;
        }

        try {
            const url = currentItemId ? `/api/items` : '/api/items';
            const method = currentItemId ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(item)
            });

            if (!response.ok) throw new Error('Failed to save item');

            showAlert(`Item ${currentItemId ? 'updated' : 'created'} successfully`, 'success');
            itemModal.style.display = 'none';
            fetchItems();
        } catch (error) {
            showAlert('Error saving item: ' + error.message, 'error');
        }
    }

    async function handleDeleteItem() {
        try {
            const response = await fetch(`/api/items/${currentItemId}`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('Failed to delete item');

            showAlert('Item deleted successfully', 'success');
            deleteModal.style.display = 'none';
            fetchItems();
        } catch (error) {
            showAlert('Error deleting item: ' + error.message, 'error');
        }
    }

    function showAlert(message, type) {
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;

        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);

        setTimeout(() => {
            alert.remove();
        }, 5000);
    }
</script>
</body>
</html>
